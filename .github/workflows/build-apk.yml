
name: Compilar Kaique AI V4

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Compilar Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          java -version

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado"
            exit 1
          fi

          echo "Usando: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extrair Kaique AI
        shell: bash
        run: |
          set -e
          test -f kaique-ai-v4-corrigido.zip

          mkdir -p projeto
          unzip -q -o kaique-ai-v4-corrigido.zip -d projeto

          echo "Arquivos Gradle encontrados:"
          find projeto -name build.gradle.kts -print

          test -f projeto/kaique-ai/app/build.gradle.kts

      - name: Configurar AndroidX
        shell: bash
        working-directory: projeto/kaique-ai
        run: |
          touch gradle.properties

          grep -q '^android.useAndroidX=' gradle.properties || \
            echo 'android.useAndroidX=true' >> gradle.properties

          grep -q '^android.enableJetifier=' gradle.properties || \
            echo 'android.enableJetifier=true' >> gradle.properties

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        working-directory: projeto/kaique-ai
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          find projeto/kaique-ai/app/build/outputs \
            -type f -name "*.apk" -print

          test -f \
            projeto/kaique-ai/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Kaique-AI-V4-APK
          path: projeto/kaique-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
