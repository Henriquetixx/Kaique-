name: Compilar Kaique AI V4

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Compilar Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extrair projeto Kaique AI
        shell: bash
        run: |
          mkdir -p projeto
          unzip -q -o kaique-ai-v4-corrigido.zip -d projeto
          find projeto -maxdepth 4 -name build.gradle.kts -print
          test -f projeto/kaique-ai/app/build.gradle.kts

      - name: Configurar AndroidX
        working-directory: projeto/kaique-ai
        shell: bash
        run: |
          touch gradle.properties
          grep -q '^android.useAndroidX=' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^android.enableJetifier=' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: projeto/kaique-ai
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Mostrar APK gerado
        if: success()
        shell: bash
        run: |
          find projeto/kaique-ai/app/build/outputs/apk \
            -type f -name "*.apk" -print
          test -f projeto/kaique-ai/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kaique-AI-V4-APK
          path: projeto/kaique-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
