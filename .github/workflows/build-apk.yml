
name: Compilar Kaique AI V4

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair Kaique AI
        run: |
          mkdir -p projeto
          unzip -q -o kaique-ai-v4-corrigido.zip -d projeto
          test -f projeto/kaique-ai/app/build.gradle.kts

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: projeto/kaique-ai
        run: gradle --no-daemon :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: kaique-ai-v4-debug-apk
          path: projeto/kaique-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
